name: 照片自动更新
description: 上传一批新照片和对应小卡片，让系统整理后更新网页
title: "照片更新："
labels: ["photo-upload"]
body:
  - type: markdown
    attributes:
      value: |
        请同时上传原照片和已经生成好的卡通小卡片。系统只负责整理、配对和更新网页，不再自动生成小卡片。

        重要：原照片和小卡片数量必须一致，并且按上传顺序一一对应。

        如果自动分类不准，可以重新开一个 issue 或手动调整生成的 `script.js`。
  - type: dropdown
    id: category
    attributes:
      label: 照片分类
      description: 如果这一批照片属于同一类，建议直接指定；如果混合很多场景，选择自动识别。
      options:
        - 自动识别
        - 居家日常 home
        - 滑雪和雪地 ski
        - 生病和陪伴 hospital
        - 视频里的见面 video
        - 娱乐时间 games
        - 美厨娘时间 cooking
        - 一起出去玩 outing
        - 其他小瞬间 moments
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 照片说明
      description: 可写地点、时间、人物或想放在网页上的配文。自动分类会参考这里的文字。
      placeholder: 例如：这批是我们去滑雪时拍的，还有两张在路上吃饭的照片。
    validations:
      required: false
  - type: textarea
    id: photos
    attributes:
      label: 原照片附件
      description: 把原始照片拖到这里。建议使用 JPG 或 PNG，HEIC 请先转成 JPG。
      placeholder: 把原照片拖到这个输入框里，GitHub 会自动生成图片链接。
    validations:
      required: true
  - type: textarea
    id: art_cards
    attributes:
      label: 卡通小卡片附件
      description: 把已经生成好的卡通小卡片拖到这里。数量和顺序必须与上面的原照片一致。
      placeholder: 把卡通小卡片拖到这个输入框里。第 1 张小卡片对应第 1 张原照片，第 2 张对应第 2 张，以此类推。
    validations:
      required: true
